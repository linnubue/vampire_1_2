[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vampire"
version = "0.0.1"
authors = [
  { name="Mario Mech" },
  { name="Janna Rückert" },
  { name="Andreas Walbröl" },
  { name="Nils Risse" },
]
description = "Ship data processing for VAMPIRE project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
]

dependencies = [
    "matplotlib>=3.7.2",
    "numpy>=1.25.0",
    "pandas>=2.0.3",
    "xarray>=2023.1.0",
    "netcdf4>=1.5.7",
    "h5py>=3.4.0",
    "python-dotenv>=0.19.0",
    "cmcrameri>=1.0.0",
    "scikit-learn>=1.3.0",
    "dask>=2023.0.0",
    "ipykernel>=6.7.0",
    "scipy>=1.7.3",
    "h5netcdf>=0.12.0",
    "seaborn>=0.12.2",
    "metpy>=1.1.0",
    "intake>=0.7.0",
    "cartopy>=0.20.0",
    "gdal>=3.3.0",
    "intake-xarray>=0.6.0",
    "imageio>=2.14.0",
    "opencv-python>=4.5.3",
    "natsort>=8.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-runner", "black", "sphinx-rtd-theme"]
